name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Swift ${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            swift: '6.4.0'
          - os: ubuntu-24.04
            swift: '6.0.3'
          - os: ubuntu-24.04
            swift: '6.4.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift }}
      - name: Validate manifest JSON
        shell: bash
        run: swift package dump-package | python3 -c 'import json,sys; json.load(sys.stdin)'
      - name: Build with complete concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test
      - name: Exercise command-line product
        run: swift run betacal month 2027 1 --format json

  format:
    name: Swift formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.0'
      - run: brew install swift-format
      - run: swift-format lint --strict --recursive Sources Tests Package.swift
